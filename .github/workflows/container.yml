name: container

# Publishes the multi-arch container image (server + edge, WebUI embedded) to
# GHCR. The image is what `deploy/compose` pulls when CLOUDPATH_IMAGE points at
# the registry (see deploy/compose/README.md). This is a public GitHub repo, so
# GHCR storage and the Linux runners are free for standard workflows.
#
#   push to main  -> ghcr.io/<owner>/cloudpath:latest
#   push a v* tag -> ghcr.io/<owner>/cloudpath:<tag> and :latest
#
# The Dockerfile builds BOTH binaries in one stage and defaults its entrypoint
# to the server; the edge service just overrides entrypoint (see the compose
# overlay). buildx builds linux/amd64 + linux/arm64 in one invocation.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/cloudpath"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${IMAGE}:${{ github.ref_name }},${IMAGE}:latest"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${IMAGE}:latest"
          else
            TAGS="${IMAGE}:${{ github.sha }}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
