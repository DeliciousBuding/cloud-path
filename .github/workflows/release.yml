name: release

# Triggered by a version tag. Builds the full platform matrix, asserts every
# artifact's OS/arch (linux/arm64 is mandatory: the production host is native
# arm64 with no emulation fallback), writes sha256 checksums.txt and publishes
# a GitHub Release.
#
# Artifact naming (SSOT: scripts/build_matrix.py, documented in CHANGELOG.md):
#   cloudpath-server_<version>_<os>_<arch>[.exe]   (built with -tags embed_ui)
#   cloudpath-edge_<version>_<os>_<arch>[.exe]
#   cloudpath_<version>_<os>_<arch>[.exe]
#   checksums.txt
#
# Efficiency: the WebUI is built ONCE (webui job) and reused by every platform
# job, so the server embed step never recompiles the frontend per runner. The
# 6 platform jobs run in parallel on separate runners.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: '1.26.3'
  NODE_VERSION: '24'
  PNPM_VERSION: '10.32.1'
  PYTHON_VERSION: '3.12'

jobs:
  webui:
    name: Build WebUI (once)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      # The server embeds webui/dist; publish it once so the matrix jobs below
      # only have to cross-compile Go.
      - name: Build frontend
        working-directory: webui
        run: pnpm build

      - name: Upload WebUI build
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.platform }})
    needs: webui
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-arm64
            platform: linux/arm64
          - id: linux-amd64
            platform: linux/amd64
          - id: windows-amd64
            platform: windows/amd64
          - id: windows-arm64
            platform: windows/arm64
          - id: darwin-amd64
            platform: darwin/amd64
          - id: darwin-arm64
            platform: darwin/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Reuse WebUI build
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      # Per-platform slice of the matrix. checksums.txt is intentionally NOT
      # written here: one authoritative file is produced by the release job so
      # merged artifacts cannot collide on the same file name.
      - name: Build and assert ${{ matrix.platform }}
        run: >-
          python scripts/build_matrix.py
          --version "${{ github.ref_name }}"
          --out dist
          --platforms "${{ matrix.platform }}"
          --no-checksums

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Collect artifacts from every platform
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # Re-asserts OS/arch/embed_ui on all merged artifacts, requires a
      # linux/arm64 server to exist, and writes the single checksums.txt.
      - name: Verify artifacts and write checksums
        run: python scripts/build_matrix.py --verify-only --out dist

      - name: Show release assets
        run: |
          ls -l dist
          cat dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            CloudPath ${{ github.ref_name }}.

            Assets follow `cloudpath-<component>_<version>_<os>_<arch>[.exe]`;
            verify them with `sha256sum -c checksums.txt --ignore-missing`.

            The server embeds the WebUI (built with `-tags embed_ui`) and every
            artifact is `CGO_ENABLED=0 -trimpath`. `linux/arm64` is the
            production deployment target; see `deploy/README.md` for the
            systemd + nginx SOP and `deploy/compose/README.md` for the
            containerized form. A multi-arch image of the same tag is published
            to GHCR by `.github/workflows/container.yml`.
          files: |
            dist/*
