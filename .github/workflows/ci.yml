name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build all Go packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
      - name: Audit public repository boundary
        run: |
          python3 scripts/public_audit.py --self-test
          python3 scripts/public_audit.py

  webui:
    name: WebUI install / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: webui
        run: pnpm exec tsc --noEmit
      - name: Test frontend
        working-directory: webui
        run: pnpm test -- --run

      - name: Build frontend
        working-directory: webui
        run: pnpm build
