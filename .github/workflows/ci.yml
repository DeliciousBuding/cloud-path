name: CI

# Versions are pinned to the repository's own declarations:
#   Go   -> go.mod            (go 1.26.3)
#   pnpm -> webui/package.json packageManager (pnpm@10.32.1)
#   Node -> 24 (Vite 6 / React 19 toolchain)
# Keep them in sync when those files change.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.3'
  NODE_VERSION: '24'
  PNPM_VERSION: '10.32.1'
  PYTHON_VERSION: '3.12'

# 6-platform release matrix — the only place that lists them for the binary
# artifact jobs. `scripts/build_matrix.py` is the actual build authority and owns
# the artifact names; keep this list in sync with its PLATFORMS tuple.
#
# Efficiency: `webui-dist` is built once and reused by every platform job, so the
# server embed step never recompiles the frontend per runner.
jobs:
  core-go:
    name: Core Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build all Go packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # The race detector needs cgo, which is not part of the Windows leg here.
      - name: Test with race detector (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -race -count=1

      - name: gofmt gate
        run: python scripts/fmtcheck.py

  webui:
    name: WebUI (install / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: webui
        run: pnpm exec tsc --noEmit

      - name: Test frontend
        working-directory: webui
        run: pnpm test -- --run

      - name: Build frontend
        working-directory: webui
        run: pnpm build

      # The server embeds webui/dist; publish it once so the matrix jobs below
      # only have to cross-compile Go (no per-runner frontend rebuild).
      - name: Upload WebUI build
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error
          retention-days: 7

  matrix-build:
    name: Build artifacts (${{ matrix.platform }})
    needs: webui
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-arm64
            platform: linux/arm64
          - id: linux-amd64
            platform: linux/amd64
          - id: windows-amd64
            platform: windows/amd64
          - id: windows-arm64
            platform: windows/arm64
          - id: darwin-amd64
            platform: darwin/amd64
          - id: darwin-arm64
            platform: darwin/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Reuse WebUI build
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      # Cross-builds this platform slice and asserts OS/arch on the artifact.
      - name: Build and assert ${{ matrix.platform }}
        run: >-
          python scripts/build_matrix.py
          --version "ci-${GITHUB_SHA::7}"
          --out dist
          --platforms "${{ matrix.platform }}"
          --no-checksums

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  matrix-verify:
    name: Verify merged artifacts + checksums
    needs: matrix-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Collect artifacts from every platform
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Re-assert artifacts and write checksums
        run: python scripts/build_matrix.py --verify-only --out dist

      - name: Show checksums
        run: cat dist/checksums.txt

  plugin-templates:
    name: Go plugin templates (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        kind: [driver, application]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: go build ./...

      - name: Vet
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: go vet ./...

      - name: Test
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: go test ./... -count=1

      - name: gofmt gate
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: python ../../../scripts/fmtcheck.py

      - name: Manifest validator self-test
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: python scripts/validate_manifest.py --self-test

      - name: Manifest + no-internal-import gate
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: python scripts/validate_manifest.py plugin.yaml --dir .

      - name: Rename self-test
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: python scripts/rename.py --self-test

  public-boundary:
    name: Public repository boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Public audit self-test
        run: python scripts/public_audit.py --self-test

      # Also gates tracked forbidden assets (runtime/binary, live config,
      # private layer, env files, local paths) and secret material.
      - name: Public audit
        run: python scripts/public_audit.py

      - name: Markdown relative-link check self-test
        run: python scripts/check_links.py --self-test

      - name: Markdown relative-link check
        run: python scripts/check_links.py

      - name: Workflow structure self-test
        run: python scripts/check_workflows.py --self-test

      - name: Workflow structure check
        run: python scripts/check_workflows.py

      - name: Artifact arch assertion self-test
        run: python scripts/assert_arch.py --self-test

      - name: Build matrix self-test
        run: python scripts/build_matrix.py --self-test
