name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  core-go:
    name: Core Go (build / vet / test / gofmt)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Set up Python (gofmt gate)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build all Go packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: gofmt gate
        run: python scripts/fmtcheck.py

  webui:
    name: WebUI (install / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: webui
        run: pnpm exec tsc --noEmit

      - name: Test frontend
        working-directory: webui
        run: pnpm test -- --run

      - name: Build frontend
        working-directory: webui
        run: pnpm build

  plugin-templates:
    name: Go plugin templates (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        kind: [driver, application]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: go build ./...

      - name: Vet
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: go vet ./...

      - name: Test
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: go test ./... -count=1

      - name: gofmt gate
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: test -z "$(gofmt -l .)"

      - name: Manifest validator self-test
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: python scripts/validate_manifest.py --self-test

      - name: Manifest + no-internal-import gate
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: python scripts/validate_manifest.py plugin.yaml --dir .

      - name: Rename self-test
        working-directory: templates/go-plugin/${{ matrix.kind }}
        run: python scripts/rename.py --self-test

  public-boundary:
    name: Public repository boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Public audit self-test
        run: python scripts/public_audit.py --self-test

      # Also gates tracked forbidden assets (runtime/binary, live config,
      # private layer, env files, local paths) and secret material.
      - name: Public audit
        run: python scripts/public_audit.py

      - name: Markdown relative-link check self-test
        run: python scripts/check_links.py --self-test

      - name: Markdown relative-link check
        run: python scripts/check_links.py
