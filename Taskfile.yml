# https://taskfile.dev —— 一键 setup/dev/build/test/lint
# 安装: go install github.com/go-task/task/v3/cmd/task@latest
version: '3'

vars:
  VERSION:
    sh: '{{if eq OS "windows"}}git describe --tags --always --dirty 2>NUL || echo dev{{else}}git describe --tags --always --dirty 2>/dev/null || echo dev{{end}}'
  LDFLAGS: -X main.version={{.VERSION}}
  BIN: bin
  # gofmt 门禁用 Python（stdlib only），避免 Windows/Unix shell 差异
  PY: '{{if eq OS "windows"}}python{{else}}python3{{end}}'

tasks:
  default:
    desc: 构建全部（前端 + 双二进制单文件）
    cmds:
      - task: build

  setup:
    desc: 首次拉取后安装依赖
    cmds:
      - go mod download
      - cd webui && pnpm install

  build:
    desc: 前端构建 → 内嵌 → server/edge 二进制（bin/）
    cmds:
      - task: webui:build
      - go build -tags embed_ui -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}}/ ./cmd/cloudpath-server
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}}/ ./cmd/cloudpath-edge

  build:linux-arm64:
    desc: 生产上线物料：Linux arm64 server（内嵌 WebUI）+ 架构断言（断言不过=非零退出）
    # 交叉编译环境放在 task 级（per-command env 不生效，实测会产出宿主架构产物并被断言拦下）。
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: arm64
    cmds:
      - task: webui:build
      - go build -tags embed_ui -trimpath -ldflags "-s -w {{.LDFLAGS}}" -o {{.BIN}}/cloudpath-server_linux_arm64 ./cmd/cloudpath-server
      - '{{.PY}} scripts/assert_arch.py --expect-os linux --expect-arch arm64 --expect-tags embed_ui {{.BIN}}/cloudpath-server_linux_arm64'

  build:matrix:
    desc: 全平台发布矩阵（server/edge/cli × linux|windows|darwin × amd64|arm64）→ dist/ + checksums.txt
    deps: [webui:build]
    cmds:
      - '{{.PY}} scripts/build_matrix.py --version {{.VERSION}} --out dist'

  verify:arch:
    desc: 不重新构建，复跑 dist/ 已有产物的 OS/架构/embed_ui 断言 + checksums 校验
    cmds:
      - '{{.PY}} scripts/build_matrix.py --verify-only --out dist'

  release:artifacts:
    desc: 发布物料一条龙：矩阵构建 → 架构断言 → 公开边界审计 → 链接检查
    cmds:
      - task: build:matrix
      - task: verify:arch
      - task: audit:public
      - task: check:links

  webui:build:
    desc: 仅构建前端
    dir: webui
    cmds:
      - pnpm install --prefer-offline
      - pnpm build

  dev:server:
    desc: 开发：server（前端走 Vite dev 代理，无需内嵌）
    cmds:
      - go run ./cmd/cloudpath-server -log-level debug

  dev:edge:
    desc: 开发：edge（读 ./edge.yaml）
    cmds:
      - go run ./cmd/cloudpath-edge -log-level debug

  dev:web:
    desc: 开发：前端热更新（:5173，代理到 :8080）
    dir: webui
    cmds:
      - pnpm dev

  test:
    desc: 全部测试（Go 单测 + 前端类型检查/组件测试）
    cmds:
      - go test ./... -count=1
      - cd webui && pnpm exec tsc --noEmit
      - cd webui && pnpm test -- --run

  test:race:
    desc: 带竞态检测的 Go 测试（需 cgo；Windows 上通常不可用，Linux/CI 用）
    cmds:
      - go test ./... -race -count=1

  vet:
    desc: go vet + gofmt 门禁
    cmds:
      - go vet ./...
      - '{{.PY}} scripts/fmtcheck.py'

  lint:
    desc: 全量静态检查（vet + gofmt + 前端类型/组件测试）
    cmds:
      - task: vet
      - cd webui && pnpm exec tsc --noEmit
      - cd webui && pnpm test -- --run

  audit:public:
    desc: 发布前审计 tracked 文件（secret/私有路径/运行态与不可再分发资产）
    cmds:
      - '{{.PY}} scripts/public_audit.py --self-test'
      - '{{.PY}} scripts/public_audit.py'

  run:
    desc: 生产模式本地起 server（:8080，内嵌前端）
    deps: [build]
    cmds:
      - '{{.BIN}}{{if eq OS "windows"}}\cloudpath-server.exe{{else}}/cloudpath-server{{end}}'

  run:edge:
    desc: 生产模式本地起 edge（读 ./edge.yaml）
    deps: [build]
    cmds:
      - '{{.BIN}}{{if eq OS "windows"}}\cloudpath-edge.exe{{else}}/cloudpath-edge{{end}}'

  clean:
    desc: 清理构建产物与本地运行数据（bin/ dist/ data/）
    cmds:
      - go clean
      - '{{.PY}} scripts/clean.py'

  selftest:scripts:
    desc: 发布脚本自测（架构断言 + 构建矩阵，stdlib-only）
    cmds:
      - '{{.PY}} scripts/assert_arch.py --self-test'
      - '{{.PY}} scripts/build_matrix.py --self-test'

  check:links:
    desc: Markdown 相对链接检查（stdlib-only，含自测）
    cmds:
      - '{{.PY}} scripts/check_links.py --self-test'
      - '{{.PY}} scripts/check_links.py'

  test:templates:
    desc: Go 插件模板（driver/application）build/vet/test/自测/无 internal import
    cmds:
      - for: [driver, application]
        cmd: >-
          cd templates/go-plugin/{{.ITEM}} && go build ./... && go vet ./... &&
          go test ./... -count=1 && {{.PY}} ../../../scripts/fmtcheck.py &&
          {{.PY}} scripts/validate_manifest.py --self-test &&
          {{.PY}} scripts/validate_manifest.py plugin.yaml --dir . &&
          {{.PY}} scripts/rename.py --self-test

  test:web:
    desc: 前端 frozen install / typecheck / test / build
    dir: webui
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm exec tsc --noEmit
      - pnpm test -- --run
      - pnpm build

  verify:
    desc: 聚合门禁（vet/test/web/template/audit/links），不递归调用自己
    cmds:
      - task: vet
      - cmd: go test ./... -count=1
      - task: test:web
      - task: test:templates
      - task: audit:public
      - task: check:links
