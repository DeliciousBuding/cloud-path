apiVersion: plugins.cloudpath.dev/v1alpha1
kind: Application
id: io.github.deliciousbuding.cloud-path-app-scheduled-compartment
version: 0.1.0
protocol: 1
# TODO(A6): replace with the Application Protocol v1 executable after A6 implementation.
entrypoint: cloud-path-app-scheduled-compartment
requirements:
  - id: reminder-output
    capability: cloudpath.dev/capability/alarm@1
    cardinality: one
  - id: compartments
    capability: cloudpath.dev/capability/contact@1
    cardinality: one-or-more
    minItems: 3
  - id: local-display
    capability: cloudpath.dev/capability/display-text@1
    cardinality: zero-or-one
