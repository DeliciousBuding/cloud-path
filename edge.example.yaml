# Cloudpath edge 配置示例 —— 复制为 edge.yaml 后按实际设备填写（edge.yaml 不入库）
# token 支持环境变量展开：${CLOUDPATH_TOKEN}（凭据不落盘）

server: ws://127.0.0.1:8080/ws/edge   # server 的 edge 接入端点；公网部署用 wss://cloudpath.vectorcontrol.tech/ws/edge
token: ${CLOUDPATH_TOKEN}              # server 启用鉴权时必填
edge_id: lab-1                         # 边缘节点唯一 ID（小写字母/数字/-/_；缺省用主机名）
                                       # 多台电脑接入同一 server 时，每台的 edge_id 必须不同

poll_interval_s: 5                     # 状态转储轮询周期（秒）
sync_interval_s: 600                   # 周期对时（秒）；设备钟漂移大就调小
report_interval_s: 30                  # 状态心跳兜底周期（秒）；diff 抑制下无变化也定期上报

devices:
  # =====================================================================
  # A) 无硬件：参考演示设备（adapter: demo）
  #    手上没有板子时用这个——不需要串口、不需要任何外设，Open 立即成功。
  #    它上报的是本 edge 进程内真实维护的状态（运行时长/心跳计数/命令计数/
  #    可写回的设定值与开关），命令真实改变这些状态并产生事件。
  #    诚实性红线：它是 reference demo device，不是真实硬件（UI 里始终如此标注）。
  #    port / baud 可以省略（demo 适配器声明 port 非必填，写了也会被忽略）。
  #    详见 examples/demo/README.md。
  # =====================================================================
  - id: sim-1
    adapter: demo
    name: 参考设备 1
  - id: sim-2
    adapter: demo
    name: 参考设备 2
    extra:                             # 适配器自定义参数（原样传给 driverkit.Config.Extra）
      tick_interval_s: "5"             # demo 心跳周期（秒，默认 10；范围 1..3600）

  # =====================================================================
  # B) 真实硬件：STC-B 学习板（adapter: stcb，需要串口，port 必填）
  #    取消注释并改成你机器上的实际端口即可；一个 edge 可带多台设备，
  #    每台各自独立监督协程——一台掉线/重插不影响同 edge 的其他设备。
  # =====================================================================
  # - id: board-1                      # 设备 ID（edge 内唯一；全局键 = <edge_id>/<id>）
  #   adapter: stcb                    # 适配器名（见 GET /api/adapters）
  #   name: 参考板                      # 展示名（可选）
  #   port: COM3                       # Windows: COM3；Linux: /dev/ttyUSB0；macOS: /dev/cu.usbserial
  #   baud: 9600
  # - id: board-2
  #   adapter: stcb
  #   port: COM4
  #   baud: 9600

# 可选的进程内外部 Driver Plugin Host（默认不启用，保持纯内置 adapter 行为）。
# 启用后由 desired-state + plugins.lock 启动外部 driver 实例；edge 退出时优雅关闭。
# 外部 driver 的 handshake/descriptor/observation 尚未桥接进 edge 数据流：
# 只报告 unsupported，不会伪装成在线设备。内置 adapter 与外部 driver ID 冲突会拒绝启动。
# plugin_host:
#   enabled: true                      # 是否启用外部 host
#   root: plugins.d                    # 插件安装根目录（支持 ${ENV} 展开）
#   state_dir: data/plugin-state       # 插件实例 desired-state 目录
#   tenant: default                    # 外部 driver 实例租户（缺省 default）
#   required: false                    # true=host 失败则 edge 启动失败；false=记录 DEGRADED 继续内置设备
#   lock: plugins.lock                 # 缺省 <root>/plugins.lock
#   close_timeout_s: 10                # host 优雅关闭 deadline（秒）
