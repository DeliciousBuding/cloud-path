# Edge 容器叠加文件。必须与 L0 compose 一起使用，且只手动启动：
#   cp deploy/edge.example.yaml deploy/edge.yaml   # 本地私有配置，gitignored
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/docker-compose.edge.yml up -d
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/docker-compose.edge.yml down
#
# 刻意不设置自动重启：Docker 守护进程/主机重启后不得自动拉起 Edge。
# Edge 的启动边界见 deploy/edge/README.md；这里由使用者显式 up/down。
name: cloudpath

services:
  edge:
    image: ${CLOUDPATH_IMAGE:-cloudpath:local}
    restart: "no"
    entrypoint: ["/app/cloudpath-edge"]
    command: ["-config", "/config/edge.yaml", "-log-level", "info", "-log-format", "json"]
    environment:
      CLOUDPATH_LOG: "${CLOUDPATH_LOG:-info}"
      CLOUDPATH_LOG_FORMAT: "${CLOUDPATH_LOG_FORMAT:-json}"
      CLOUDPATH_TOKEN: "${CLOUDPATH_TOKEN:-}"
    volumes:
      - ${EDGE_CONFIG:-../edge.yaml}:/config/edge.yaml:ro
    # 不声明 depends_on：Edge 的启动顺序由使用者显式控制，不与 Server 健康检查绑定。
    # Linux 直通真实串口时取消注释并改成实际设备路径。
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 128
