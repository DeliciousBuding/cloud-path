# Edge 容器叠加文件。与 deploy/docker-compose.yml 一起启动：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.edge.yml up -d --build
name: cloudpath

services:
  edge:
    image: cloudpath:local
    restart: unless-stopped
    entrypoint: ["/app/cloudpath-edge"]
    command: ["-config", "/config/edge.yaml", "-log-level", "info", "-log-format", "json"]
    environment:
      CLOUDPATH_LOG: "${CLOUDPATH_LOG:-info}"
      CLOUDPATH_LOG_FORMAT: "${CLOUDPATH_LOG_FORMAT:-json}"
      CLOUDPATH_TOKEN: "${CLOUDPATH_TOKEN:-}"
    volumes:
      - ./edge.example.yaml:/config/edge.yaml:ro
    # 与基础 compose 一起启动时，server 会先经健康检查；不强制声明 depends_on，
    # 以便该 overlay 也可单独做 compose config 校验。
    # Linux 直通真实串口时取消注释并改成实际设备路径。
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
