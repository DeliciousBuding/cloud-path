# CloudPath public site — nginx reverse proxy (HTTPS + WSS).
#
# Install (Debian/Ubuntu style layout):
#   sudo install -D -m 0644 deploy/nginx/cloudpath.vectorcontrol.tech.conf \
#        /etc/nginx/sites-available/cloudpath.vectorcontrol.tech.conf
#   sudo ln -s /etc/nginx/sites-available/cloudpath.vectorcontrol.tech.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites you must adapt before `nginx -t`:
#   1. ssl_certificate / ssl_certificate_key -> the real wildcard certificate
#      paths on this host. The private key must stay root-readable only and must
#      never be copied into this repository.
#   2. set_real_ip_from -> the CDN/edge proxy ranges that terminate in front of
#      this host, if any (see the Cloudflare published ranges page). Without it
#      the application sees the CDN IP instead of the client IP.
#   3. CloudPath itself must be told that this proxy is trusted, otherwise it
#      ignores X-Forwarded-*:  CLOUDPATH_TRUSTED_PROXIES=127.0.0.1
#      (see deploy/systemd/cloudpath-server.env.example)
#
# Authentication note: CloudPath ships its own login, RBAC and multi-tenancy, so
# this site is intentionally PUBLIC at the proxy layer — do not add an
# auth_request / basic-auth front door here, it would fight the application's
# own session cookie and WebSocket token handling.

# WebSocket upgrade helper. Prefixed name to avoid colliding with maps defined
# by other sites on the same host. Placed at http{} level (this file is included
# from http{} by sites-enabled/*).
map $http_upgrade $cp_connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP -> HTTPS ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cloudpath.vectorcontrol.tech;

    # Keep ACME challenge paths working if a certificate is ever renewed on-host.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS + WSS ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2: use the directive form on nginx >= 1.25.1, keep it commented on
    # older releases (there `listen ... http2` is the equivalent).
    # http2 on;
    server_name cloudpath.vectorcontrol.tech;

    # >>> REPLACE with the real wildcard certificate paths on this host <<<
    ssl_certificate     /etc/nginx/ssl/vectorcontrol.tech-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/vectorcontrol.tech-wildcard/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CloudPathSSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # HSTS is added here because the application does not set it. All other
    # security headers (CSP, X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy) are set by CloudPath itself — do NOT
    # re-add or override them here: the CSP carries a build-time inline-script
    # hash and a wrong override breaks the console.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The API enforces its own small request limits (4 KiB bodies); 1m is a
    # generous outer bound that still stops abuse and large uploads.
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # >>> REPLACE/APPEND: CDN or upstream proxy ranges in front of this host <<<
    # Public list: https://www.cloudflare.com/ips/
    # set_real_ip_from 198.51.100.0/24;
    # set_real_ip_from 203.0.113.0/24;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Compression for JSON/REST and text assets. WebSocket locations disable it
    # explicitly below (per-message compression is negotiated by the app).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # Application upstream. Must match CLOUDPATH_ADDR in the systemd unit.
    # Kept on loopback: the app port is never exposed to the internet.
    #
    # Timeouts: /ws and /ws/edge are long-lived WebSocket connections carrying
    # device state, events and command acknowledgements. A 60s read timeout
    # would tear down healthy sessions, so these locations use 1h plus
    # application-level heartbeats.

    location = /ws/edge {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        tcp_nodelay on;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        tcp_nodelay on;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_redirect off;
        # Cache-Control for the SPA shell and hashed /assets/* is set by the
        # application (no-cache for index.html, immutable for assets); do not
        # override it here.
        proxy_buffering on;
    }

    # Never proxy the app port straight through on a second listen directive and
    # never expose the SQLite directory: /var/lib/cloudpath is not a web root.
    location ~ /\. {
        deny all;
    }
}
