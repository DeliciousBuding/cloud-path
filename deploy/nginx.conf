# Generic nginx reverse-proxy example for CloudPath.
#
# This is the host-agnostic template: it uses console.example.com and
# Let's Encrypt-style certificate paths. For a concrete, ready-to-install public
# site (wildcard certificate, CDN real-IP handling, WebSocket-specific timeouts)
# see deploy/nginx/cloudpath.vectorcontrol.tech.conf and the SOP in
# deploy/README.md.
#
# The application already sets X-Content-Type-Options / X-Frame-Options /
# Referrer-Policy / Permissions-Policy / CSP, so this file only adds HSTS.
# The CSP carries a build-time inline-script hash — never re-declare it here.
#
# Install: replace server_name and the certificate paths, then validate:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cloudpath
#   sudo nginx -t && sudo systemctl reload nginx

# WebSocket upgrade helper (http{} level; unique name avoids collisions).
map $http_upgrade $cp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name console.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # http2 on;            # nginx >= 1.25.1 (older: "listen 443 ssl http2;")
    server_name console.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CloudPathSSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    # Long-lived WebSocket channels (browser console and Edge uplink). A 60s
    # read timeout tears down healthy sessions, so these get 1h; the application
    # sends its own heartbeats.
    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        gzip off;
    }

    location = /ws/edge {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
